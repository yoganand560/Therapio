<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Therapio – Login/Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #10b981;
      --primary-light: #d1fae5;
      --secondary: #0f766e;
      --secondary-dark: #115e59;
      --background: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --gradient: linear-gradient(135deg, #10b981 0%, #0d9488 100%);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 25px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 40px rgba(15, 118, 110, 0.12);
      --radius: 12px;
      --radius-lg: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ================= NAVBAR ================= */
    nav {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 5%;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--secondary);
      text-decoration: none;
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    .logo img {
      height: 40px;
      border-radius: 8px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 32px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      transition: color 0.3s ease;
      position: relative;
    }

    nav a:hover {
      color: var(--secondary);
    }

    .btn {
      background: var(--gradient);
      color: white;
      padding: 12px 26px;
      border-radius: var(--radius);
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    /* ================= LOGIN PAGE ================= */
    .login-page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    body.login-page {
      display: flex;
      flex-direction: column;
    }

    .login-container {
      width: 100%;
      max-width: 550px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Forms */
    .login-form-container {
      padding: 45px 55px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    .form-header {
      margin-bottom: 35px;
      text-align: center;
    }

    .form-header h1 {
      font-size: 2.3rem;
      color: var(--secondary);
      margin-bottom: 10px;
      background: linear-gradient(120deg, var(--secondary-dark), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-header p {
      color: var(--text-light);
      font-size: 1rem;
    }

    .tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: var(--radius);
      padding: 5px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 15px;
      background: none;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      border-radius: calc(var(--radius) - 2px);
      transition: all 0.3s ease;
    }

    .tab.active {
      background: white;
      color: var(--secondary);
      box-shadow: var(--shadow-sm);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 500;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .form-group label i {
      color: var(--primary);
    }

    .form-group input {
      width: 100%;
      padding: 13px;
      border: 2px solid #e2e8f0;
      border-radius: var(--radius);
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background: #f8fafc;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 42px;
      cursor: pointer;
      color: var(--text-light);
      transition: color 0.3s ease;
    }

    .password-toggle:hover {
      color: var(--primary);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-light);
    }

    .checkbox input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
      font-size: 0.9rem;
    }

    .forgot-link:hover {
      color: var(--secondary);
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      margin-bottom: 20px;
    }

    .auth-btn i {
      margin-right: 10px;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 25px 0;
      color: var(--text-light);
      font-size: 0.9rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }

    .divider span {
      padding: 0 15px;
    }

    .social-auth {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .social-btn {
      width: 100%;
      padding: 13px;
      border: 2px solid #e2e8f0;
      border-radius: var(--radius);
      background: white;
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .social-btn:hover {
      border-color: var(--primary);
      background: #f8fafc;
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .social-btn i {
      font-size: 1.2rem;
    }

    .social-btn.google {
      border-color: #DB4437;
      color: #DB4437;
    }

    .social-btn.google:hover {
      background: #DB4437;
      color: white;
      border-color: #DB4437;
    }

    .social-btn.microsoft {
      border-color: #00A4EF;
      color: #00A4EF;
    }

    .social-btn.microsoft:hover {
      background: #00A4EF;
      color: white;
      border-color: #00A4EF;
    }

    .switch-form {
      text-align: center;
      color: var(--text-light);
    }

    .switch-form a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .switch-form a:hover {
      color: var(--secondary);
    }

    /* Footer */
    .login-footer {
      padding: 30px 20px;
      text-align: center;
      background: transparent;
    }

    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .back-home-btn i {
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .login-form-container {
        padding: 35px 25px;
      }

      .login-container {
        max-width: 95%;
        padding: 30px 15px;
      }

      .login-footer {
        padding: 20px 15px;
      }
    }

    @media (max-width: 480px) {
      .form-header h1 {
        font-size: 1.8rem;
      }

      .form-header p {
        font-size: 0.9rem;
      }
      
      .tabs {
        flex-direction: row;
      }
      
      .tab {
        padding: 12px 10px;
        font-size: 0.95rem;
      }

      .login-form-container {
        padding: 30px 20px;
      }

      .btn {
        padding: 10px 20px;
        font-size: 0.9rem;
      }

      .login-container {
        padding: 20px 10px;
      }

      .login-footer {
        padding: 15px 10px;
      }

      .logo img {
        height: 35px;
      }
    }
  </style>
</head>
<body class="login-page">
  <nav>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="https://i.ibb.co/ZRXL2Wsz/Gemini-Generated-Image-pjrfy0pjrfy0pjrf.png" alt="Therapio Logo">
      </a>
    </div>
  </nav>

  <div class="login-container">
    <div class="login-form-container">
      <div class="form-header">
        <h1>Welcome Back</h1>
        <p>Sign in to your Therapio account or create a new one</p>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="register">Register</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form active">
        <!-- Social Login Options -->
        <div class="social-auth">
          <button type="button" class="social-btn google" id="google-login">
            <i class="fab fa-google"></i>
            Continue with Google
          </button>
          <button type="button" class="social-btn microsoft" id="microsoft-login">
            <i class="fab fa-microsoft"></i>
            Continue with Microsoft
          </button>
        </div>

        <div class="divider">
          <span>OR</span>
        </div>

        <div class="form-group">
          <label for="login-email">
            <i class="fas fa-envelope"></i> Email Address
          </label>
          <input type="email" id="login-email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="login-password">
            <i class="fas fa-lock"></i> Password
          </label>
          <input type="password" id="login-password" placeholder="Enter your password" required>
          <div class="password-toggle">
            <i class="fas fa-eye" id="toggle-password"></i>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox">
            <input type="checkbox" id="remember-me">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn auth-btn">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>

        <p class="switch-form">
          Don't have an account? <a href="#" data-tab="register">Sign up here</a>
        </p>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form">
        <!-- Social Registration Options -->
        <div class="social-auth">
          <button type="button" class="social-btn google" id="google-register">
            <i class="fab fa-google"></i>
            Sign up with Google
          </button>
          <button type="button" class="social-btn microsoft" id="microsoft-register">
            <i class="fab fa-microsoft"></i>
            Sign up with Microsoft
          </button>
        </div>

        <div class="divider">
          <span>OR</span>
        </div>

        <div class="form-group">
          <label for="register-name">
            <i class="fas fa-user"></i> Full Name
          </label>
          <input type="text" id="register-name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="register-email">
            <i class="fas fa-envelope"></i> Email Address
          </label>
          <input type="email" id="register-email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="register-password">
            <i class="fas fa-lock"></i> Password
          </label>
          <input type="password" id="register-password" placeholder="Create a password" required>
          <div class="password-toggle">
            <i class="fas fa-eye" id="toggle-register-password"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="register-confirm">
            <i class="fas fa-lock"></i> Confirm Password
          </label>
          <input type="password" id="register-confirm" placeholder="Confirm your password" required>
        </div>

        <div class="form-group checkbox-group">
          <label class="checkbox">
            <input type="checkbox" id="terms" required>
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn auth-btn">
          <i class="fas fa-user-plus"></i> Create Account
        </button>

        <p class="switch-form">
          Already have an account? <a href="#" data-tab="login">Sign in here</a>
        </p>
      </form>
    </div>
  </div>

  <footer class="login-footer">
    <a href="index.html" class="btn back-home-btn">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    // Initialize Firebase
    let auth, db;
    
    // Login/Register Form Functionality
    document.addEventListener('DOMContentLoaded', function() {
      console.log('Page loaded, initializing Firebase...');
      
      // Check if Firebase SDK is loaded
      if (typeof firebase === 'undefined') {
        console.error('❌ Firebase SDK not loaded! Check your internet connection.');
        alert('Firebase SDK failed to load. Please check your internet connection and refresh the page.');
        return;
      }
      
      // Initialize Firebase
      if (initializeFirebase()) {
        auth = firebase.auth();
        db = firebase.firestore();
        console.log('✅ Firebase initialized successfully');
        
        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
          if (user) {
            console.log('User already logged in:', user.email);
            // User is signed in, redirect to dashboard
            window.location.href = 'dashboard.html';
          } else {
            console.log('No user logged in');
          }
        });
      } else {
        console.error('❌ Firebase initialization failed!');
        alert('Firebase configuration error. Please check firebase-config.js file.');
        return;
      }
      
      // Tab switching
      const tabs = document.querySelectorAll('.tab');
      const forms = document.querySelectorAll('.auth-form');
      const switchLinks = document.querySelectorAll('.switch-form a');
      
      tabs.forEach(tab => {
        tab.addEventListener('click', function() {
          const tabName = this.getAttribute('data-tab');
          
          // Update active tab
          tabs.forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          
          // Show corresponding form
          forms.forEach(form => {
            form.classList.remove('active');
            if (form.id === `${tabName}-form`) {
              form.classList.add('active');
            }
          });
        });
      });
      
      // Switch form links
      switchLinks.forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const tabName = this.getAttribute('data-tab');
          
          // Find and click the corresponding tab
          const targetTab = document.querySelector(`.tab[data-tab="${tabName}"]`);
          if (targetTab) targetTab.click();
        });
      });
      
      // Password toggle visibility
      const togglePassword = document.getElementById('toggle-password');
      const toggleRegisterPassword = document.getElementById('toggle-register-password');
      const loginPassword = document.getElementById('login-password');
      const registerPassword = document.getElementById('register-password');
      
      function togglePasswordVisibility(button, input) {
        if (!button || !input) return;
        
        button.addEventListener('click', function() {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
          input.setAttribute('type', type);
          this.classList.toggle('fa-eye');
          this.classList.toggle('fa-eye-slash');
        });
      }
      
      togglePasswordVisibility(togglePassword, loginPassword);
      togglePasswordVisibility(toggleRegisterPassword, registerPassword);
      
      // Social Authentication Handlers
      async function handleSocialAuth(providerType) {
        try {
          let provider;
          
          if (providerType === 'google') {
            provider = new firebase.auth.GoogleAuthProvider();
          } else if (providerType === 'microsoft') {
            provider = new firebase.auth.OAuthProvider('microsoft.com');
          }
          
          // Show loading state
          const allSocialBtns = document.querySelectorAll('.social-btn');
          allSocialBtns.forEach(btn => {
            btn.disabled = true;
            if (btn.id.includes(providerType)) {
              btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting...';
            }
          });
          
          // Sign in with popup
          const result = await auth.signInWithPopup(provider);
          const user = result.user;
          
          // Check if user document exists
          const userDoc = await db.collection('users').doc(user.uid).get();
          
          if (!userDoc.exists) {
            // New user - create profile
            const avatarUrl = user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.displayName) + '&background=10b981&color=fff';
            
            await db.collection('users').doc(user.uid).set({
              name: user.displayName || user.email.split('@')[0],
              email: user.email,
              avatar: avatarUrl,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
              authProvider: providerType,
              preferences: {
                notifications: true,
                theme: 'light',
                emailUpdates: true
              },
              stats: {
                totalSessions: 0,
                totalMessages: 0,
                moodEntries: 0
              }
            });
          } else {
            // Existing user - update last login
            await db.collection('users').doc(user.uid).update({
              lastLogin: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
          
          // Get final user data
          const finalUserDoc = await db.collection('users').doc(user.uid).get();
          const userData = finalUserDoc.data();
          
          // Store user session
          localStorage.setItem('therapio_user', JSON.stringify({
            uid: user.uid,
            name: userData.name || user.displayName,
            email: user.email,
            loggedIn: true,
            avatar: userData.avatar || user.photoURL
          }));
          
          // Redirect to dashboard
          window.location.href = 'dashboard.html';
          
        } catch (error) {
          console.error('Social auth error:', error);
          
          let errorMessage = 'Authentication failed. Please try again.';
          
          if (error.code === 'auth/popup-closed-by-user') {
            errorMessage = 'Sign-in was cancelled. Please try again.';
          } else if (error.code === 'auth/account-exists-with-different-credential') {
            errorMessage = 'An account already exists with this email using a different sign-in method.';
          } else if (error.code === 'auth/popup-blocked') {
            errorMessage = 'Pop-up was blocked. Please allow pop-ups for this site.';
          }
          
          alert(errorMessage);
          
          // Re-enable buttons
          const allSocialBtns = document.querySelectorAll('.social-btn');
          allSocialBtns.forEach(btn => {
            btn.disabled = false;
            if (btn.id.includes('google')) {
              btn.innerHTML = '<i class="fab fa-google"></i> ' + (btn.id.includes('login') ? 'Continue with Google' : 'Sign up with Google');
            } else if (btn.id.includes('microsoft')) {
              btn.innerHTML = '<i class="fab fa-microsoft"></i> ' + (btn.id.includes('login') ? 'Continue with Microsoft' : 'Sign up with Microsoft');
            }
          });
        }
      }
      
      // Social auth button listeners
      const googleLoginBtn = document.getElementById('google-login');
      const googleRegisterBtn = document.getElementById('google-register');
      const microsoftLoginBtn = document.getElementById('microsoft-login');
      const microsoftRegisterBtn = document.getElementById('microsoft-register');
      
      if (googleLoginBtn) {
        googleLoginBtn.addEventListener('click', () => handleSocialAuth('google'));
      }
      
      if (googleRegisterBtn) {
        googleRegisterBtn.addEventListener('click', () => handleSocialAuth('google'));
      }
      
      if (microsoftLoginBtn) {
        microsoftLoginBtn.addEventListener('click', () => handleSocialAuth('microsoft'));
      }
      
      if (microsoftRegisterBtn) {
        microsoftRegisterBtn.addEventListener('click', () => handleSocialAuth('microsoft'));
      }
      
      // Form submission
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      
      if (loginForm) {
        loginForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          const email = document.getElementById('login-email').value;
          const password = document.getElementById('login-password').value;
          const submitBtn = loginForm.querySelector('button[type="submit"]');
          
          // Simple validation
          if (!email || !password) {
            alert('Please fill in all fields');
            return;
          }
          
          // Disable button and show loading
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
          
          try {
            // Sign in with Firebase
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            const user = userCredential.user;
            
            // Update last login
            await db.collection('users').doc(user.uid).update({
              lastLogin: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            // Get user data
            const userDoc = await db.collection('users').doc(user.uid).get();
            const userData = userDoc.data();
            
            // Store user session
            localStorage.setItem('therapio_user', JSON.stringify({
              uid: user.uid,
              name: userData.name || user.displayName,
              email: user.email,
              loggedIn: true,
              avatar: userData.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(userData.name) + '&background=10b981&color=fff'
            }));
            
            // Redirect to dashboard
            window.location.href = 'dashboard.html';
          } catch (error) {
            console.error('Login error:', error);
            let errorMessage = 'Invalid email or password';
            
            if (error.code === 'auth/user-not-found') {
              errorMessage = 'No account found with this email';
            } else if (error.code === 'auth/wrong-password') {
              errorMessage = 'Incorrect password';
            } else if (error.code === 'auth/invalid-email') {
              errorMessage = 'Invalid email address';
            }
            
            alert(errorMessage);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
          }
        });
      }
      
      if (registerForm) {
        registerForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          console.log('📝 Registration form submitted');
          
          const name = document.getElementById('register-name').value;
          const email = document.getElementById('register-email').value;
          const password = document.getElementById('register-password').value;
          const confirmPassword = document.getElementById('register-confirm').value;
          const terms = document.getElementById('terms').checked;
          const submitBtn = registerForm.querySelector('button[type="submit"]');
          
          console.log('Form data:', { name, email, passwordLength: password.length, termsAccepted: terms });
          
          // Validation
          if (!name || !email || !password || !confirmPassword) {
            console.error('❌ Validation failed: Missing fields');
            alert('Please fill in all fields');
            return;
          }
          
          if (password !== confirmPassword) {
            console.error('❌ Validation failed: Passwords do not match');
            alert('Passwords do not match');
            return;
          }
          
          if (password.length < 6) {
            console.error('❌ Validation failed: Password too short');
            alert('Password must be at least 6 characters long');
            return;
          }
          
          if (!terms) {
            console.error('❌ Validation failed: Terms not accepted');
            alert('Please agree to the Terms of Service and Privacy Policy');
            return;
          }
          
          console.log('✅ Validation passed, creating account...');
          
          // Disable button and show loading
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
          
          try {
            console.log('Creating Firebase user...');
            // Create user with Firebase Auth
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;
            console.log('✅ Firebase user created:', user.uid);
            
            // Update display name
            console.log('Updating display name...');
            await user.updateProfile({
              displayName: name
            });
            console.log('✅ Display name updated');
            
            const avatarUrl = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name) + '&background=10b981&color=fff';
            
            // Create user profile in Firestore
            console.log('Creating Firestore profile...');
            await db.collection('users').doc(user.uid).set({
              name: name,
              email: email,
              avatar: avatarUrl,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
              preferences: {
                notifications: true,
                theme: 'light',
                emailUpdates: true
              },
              stats: {
                totalSessions: 0,
                totalMessages: 0,
                moodEntries: 0
              }
            });
            console.log('✅ Firestore profile created');
            
            // Store user session
            localStorage.setItem('therapio_user', JSON.stringify({
              uid: user.uid,
              name: name,
              email: email,
              loggedIn: true,
              avatar: avatarUrl
            }));
            console.log('✅ Session stored in localStorage');
            
            alert('Registration successful! Welcome to Therapio!');
            console.log('🎉 Registration complete! Redirecting to dashboard...');
            
            // Redirect to dashboard
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1000);
            
          } catch (error) {
            console.error('❌ Registration error:', error);
            console.error('Error code:', error.code);
            console.error('Error message:', error.message);
            
            let errorMessage = 'Registration failed. Please try again.';
            
            if (error.code === 'auth/email-already-in-use') {
              errorMessage = 'Email already registered. Please login instead.';
            } else if (error.code === 'auth/invalid-email') {
              errorMessage = 'Invalid email address';
            } else if (error.code === 'auth/weak-password') {
              errorMessage = 'Password is too weak. Use at least 6 characters.';
            } else if (error.code === 'auth/network-request-failed') {
              errorMessage = 'Network error. Check your internet connection.';
            } else if (error.message.includes('API key')) {
              errorMessage = 'Firebase not configured. Please check firebase-config.js';
            }
            
            alert(errorMessage);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
          }
        });
      }
    });
  </script>
</body>
</html>
