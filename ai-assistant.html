<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Therapio – AI Mental Health Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #10b981;
      --primary-light: #d1fae5;
      --secondary: #0f766e;
      --secondary-dark: #115e59;
      --background: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --gradient: linear-gradient(135deg, #10b981 0%, #0d9488 100%);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 25px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 40px rgba(15, 118, 110, 0.12);
      --radius: 12px;
      --radius-lg: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ================= NAVBAR ================= */
    nav {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 5%;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--secondary);
      text-decoration: none;
    }

    .logo img {
      height: 40px;
      border-radius: 8px;
    }

    .btn {
      background: var(--gradient);
      color: white;
      padding: 12px 26px;
      border-radius: var(--radius);
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    /* ================= CHAT CONTAINER ================= */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      height: calc(100vh - 70px);
    }

    .chat-header {
      text-align: center;
      padding: 30px 20px;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }

    .chat-header h1 {
      font-size: 2rem;
      color: var(--secondary);
      margin-bottom: 10px;
      background: linear-gradient(120deg, var(--secondary-dark), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .chat-header p {
      color: var(--text-light);
      font-size: 1rem;
    }

    .chat-box {
      flex: 1;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .message.assistant .message-avatar {
      background: var(--gradient);
      color: white;
    }

    .message.user .message-avatar {
      background: var(--secondary-dark);
      color: white;
    }

    .message-content {
      max-width: 70%;
      padding: 15px 20px;
      border-radius: var(--radius);
      line-height: 1.6;
    }

    .message.assistant .message-content {
      background: var(--primary-light);
      color: var(--text);
    }

    .message.user .message-content {
      background: var(--secondary);
      color: white;
    }

    .message-time {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 5px;
    }

    .typing-indicator {
      display: none;
      padding: 15px 20px;
      background: var(--primary-light);
      border-radius: var(--radius);
      width: fit-content;
    }

    .typing-indicator.active {
      display: block;
    }

    .typing-indicator span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--secondary);
      margin: 0 2px;
      animation: typing 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-10px);
      }
    }

    .input-container {
      padding: 20px;
      border-top: 1px solid #e2e8f0;
      background: #f8fafc;
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #message-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e2e8f0;
      border-radius: var(--radius);
      font-size: 1rem;
      transition: all 0.3s ease;
      background: white;
      resize: none;
      min-height: 50px;
      max-height: 150px;
      font-family: 'Inter', sans-serif;
    }

    #message-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    #send-btn {
      padding: 14px 24px;
      min-width: 100px;
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .welcome-message {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }

    .welcome-message i {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 20px;
    }

    .suggested-prompts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .prompt-btn {
      padding: 12px 16px;
      background: white;
      border: 2px solid var(--primary-light);
      border-radius: var(--radius);
      color: var(--secondary);
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9rem;
      text-align: left;
    }

    .prompt-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin: 10px 0;
      border-left: 4px solid #dc2626;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .chat-container {
        padding: 10px;
      }

      .chat-header h1 {
        font-size: 1.5rem;
      }

      .message-content {
        max-width: 85%;
      }

      .suggested-prompts {
        grid-template-columns: 1fr;
      }

      .messages-container {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="https://i.ibb.co/ZRXL2Wsz/Gemini-Generated-Image-pjrfy0pjrfy0pjrf.png" alt="Therapio Logo">
      </a>
      <div style="display: flex; gap: 12px; align-items: center;">
        <button onclick="clearChat()" class="btn" style="background: #ef4444;">
          <i class="fas fa-trash"></i> Clear Chat
        </button>
        <a href="index.html" class="btn">
          <i class="fas fa-arrow-left"></i> Back to Home
        </a>
      </div>
    </div>
  </nav>

  <div class="chat-container">
    <div class="chat-header">
      <h1><i class="fas fa-brain"></i> AI Mental Health Assistant</h1>
      <p>Your compassionate AI companion for mental wellness support - Free 24/7</p>
    </div>

    <div class="chat-box">
      <div class="messages-container" id="messages-container">
        <div class="welcome-message">
          <i class="fas fa-comments"></i>
          <h3>Welcome! I'm your AI Mental Health Assistant 🤖</h3>
          <p>I'm here to provide support, listen, and help you navigate your mental wellness journey. How can I help you today?</p>
          
          <div class="suggested-prompts">
            <button class="prompt-btn" onclick="sendPrompt('I\'m feeling anxious today')">I'm feeling anxious today</button>
            <button class="prompt-btn" onclick="sendPrompt('Can you help me with stress management?')">Help with stress management</button>
            <button class="prompt-btn" onclick="sendPrompt('I need some motivation')">I need some motivation</button>
            <button class="prompt-btn" onclick="sendPrompt('Tell me about mindfulness')">Tell me about mindfulness</button>
          </div>
        </div>
      </div>

      <div class="input-container">
        <div class="input-wrapper">
          <textarea 
            id="message-input" 
            placeholder="Type your message here..." 
            rows="1"
            onkeydown="handleEnter(event)"
          ></textarea>
          <button id="send-btn" class="btn" onclick="sendMessage()">
            <i class="fas fa-paper-plane"></i> Send
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    // Using the provided API key
    const API_KEY = 'AIzaSyBcRPKKNVCBqmd4vZl3GeRNHCSoHyedgPU';
    
    // Initialize Firebase and get current user
    let currentUser = null;
    let sessionStartTime = Date.now();
    
    // Initialize Firebase when page loads
    window.addEventListener('DOMContentLoaded', function() {
      initializeFirebase();
      
      // Check if user is logged in
      if (typeof firebase !== 'undefined' && firebase.auth) {
        firebase.auth().onAuthStateChanged((user) => {
          if (user) {
            // User is signed in
            currentUser = user.uid;
            loadChatHistory();
          } else {
            // Not signed in, use anonymous user ID
            currentUser = localStorage.getItem('userId');
            if (!currentUser) {
              currentUser = 'user_' + Math.random().toString(36).substr(2, 9);
              localStorage.setItem('userId', currentUser);
            }
            loadChatHistory();
          }
        });
      } else {
        // Firebase not initialized, use anonymous ID
        currentUser = localStorage.getItem('userId');
        if (!currentUser) {
          currentUser = 'user_' + Math.random().toString(36).substr(2, 9);
          localStorage.setItem('userId', currentUser);
        }
        loadChatHistory();
      }
    });

    function handleEnter(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function sendPrompt(text) {
      document.getElementById('message-input').value = text;
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const message = input.value.trim();
      
      if (!message) return;

      // Clear input and disable send button
      input.value = '';
      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;

      // Remove welcome message if exists
      const welcomeMsg = document.querySelector('.welcome-message');
      if (welcomeMsg) {
        welcomeMsg.remove();
      }

      // Add user message
      addMessage(message, 'user');
      
      // Save user message to database
      if (typeof database !== 'undefined') {
        database.saveChatMessage(currentUser, { text: message, sender: 'user' });
      }

      // Show typing indicator
      const typingIndicator = showTypingIndicator();

      try {
        // Call Gemini API
        const response = await callGeminiAPI(message);
        
        // Remove typing indicator
        typingIndicator.remove();
        
        // Add assistant response
        addMessage(response, 'assistant');
        
        // Save assistant response to database
        if (typeof database !== 'undefined') {
          database.saveChatMessage(currentUser, { text: response, sender: 'assistant' });
        }
        
      } catch (error) {
        typingIndicator.remove();
        console.error('Error:', error);
        addErrorMessage('Sorry, I encountered an error. Please try again in a moment.');
      } finally {
        sendBtn.disabled = false;
      }

      // Scroll to bottom
      scrollToBottom();
    }

    async function callGeminiAPI(message) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`;
      
      // Add system context for mental health support
      const systemContext = "You are a compassionate and empathetic AI mental health assistant for Therapio. Your role is to provide emotional support, coping strategies, and mindfulness techniques. Always be kind, understanding, and encouraging. If someone is in crisis, remind them to seek professional help immediately. Keep responses concise, supportive, and actionable.";
      
      const prompt = `${systemContext}\n\nUser: ${message}\n\nAssistant:`;
      
      const requestBody = {
        contents: [{
          parts: [{
            text: prompt
          }]
        }],
        generationConfig: {
          temperature: 0.7,
          topK: 40,
          topP: 0.95,
          maxOutputTokens: 1024,
        }
      };

      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        throw new Error(`API Error: ${response.status}`);
      }

      const data = await response.json();
      
      if (data.candidates && data.candidates[0] && data.candidates[0].content) {
        return data.candidates[0].content.parts[0].text;
      } else {
        throw new Error('Invalid response from API');
      }
    }

    function addMessage(text, sender, showTime = true) {
      const messagesContainer = document.getElementById('messages-container');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.innerHTML = sender === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-brain"></i>';
      
      const content = document.createElement('div');
      content.className = 'message-content';
      content.innerHTML = text.replace(/\n/g, '<br>');
      
      if (showTime) {
        const time = document.createElement('div');
        time.className = 'message-time';
        time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        content.appendChild(time);
      }
      
      messageDiv.appendChild(avatar);
      messageDiv.appendChild(content);
      messagesContainer.appendChild(messageDiv);
    }

    function showTypingIndicator() {
      const messagesContainer = document.getElementById('messages-container');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message assistant';
      
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.innerHTML = '<i class="fas fa-brain"></i>';
      
      const typingDiv = document.createElement('div');
      typingDiv.className = 'typing-indicator active';
      typingDiv.innerHTML = '<span></span><span></span><span></span>';
      
      messageDiv.appendChild(avatar);
      messageDiv.appendChild(typingDiv);
      messagesContainer.appendChild(messageDiv);
      
      scrollToBottom();
      return messageDiv;
    }

    function addErrorMessage(text) {
      const messagesContainer = document.getElementById('messages-container');
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error-message';
      errorDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${text}`;
      messagesContainer.appendChild(errorDiv);
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    // Load chat history from database
    async function loadChatHistory() {
      if (typeof database === 'undefined') return;
      
      const result = await database.getChatHistory(currentUser, 20);
      if (result.success && result.data.length > 0) {
        // Remove welcome message
        const welcomeMsg = document.querySelector('.welcome-message');
        if (welcomeMsg) {
          welcomeMsg.remove();
        }
        
        // Display previous messages
        result.data.forEach(msg => {
          if (msg.message && msg.sender) {
            addMessage(msg.message, msg.sender, false);
          }
        });
        
        scrollToBottom();
      }
    }
    
    // Clear chat history
    async function clearChat() {
      if (confirm('Are you sure you want to clear all chat history?')) {
        if (typeof database !== 'undefined') {
          await database.clearChatHistory(currentUser);
        }
        
        // Clear UI
        const messagesContainer = document.getElementById('messages-container');
        messagesContainer.innerHTML = `
          <div class="welcome-message">
            <i class="fas fa-comments"></i>
            <h3>Welcome! I'm your AI Mental Health Assistant 🤖</h3>
            <p>I'm here to provide support, listen, and help you navigate your mental wellness journey. How can I help you today?</p>
            
            <div class="suggested-prompts">
              <button class="prompt-btn" onclick="sendPrompt('I\\'m feeling anxious today')">I'm feeling anxious today</button>
              <button class="prompt-btn" onclick="sendPrompt('Can you help me with stress management?')">Help with stress management</button>
              <button class="prompt-btn" onclick="sendPrompt('I need some motivation')">I need some motivation</button>
              <button class="prompt-btn" onclick="sendPrompt('Tell me about mindfulness')">Tell me about mindfulness</button>
            </div>
          </div>
        `;
      }
    }

    // Auto-resize textarea
    const textarea = document.getElementById('message-input');
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 150) + 'px';
    });
  </script>
</body>
</html>
